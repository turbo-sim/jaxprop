name: Publish package to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:

  test_ubuntu:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "true"
      JAX_PLATFORM_NAME: cpu
      JAXPROP_TEST_BACKENDS: HEOS
      MPLBACKEND: Agg

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: python -m pip install "poetry>=2.1,<3"
    
    - name: Install dependencies
      run: |
        poetry install
        poetry run python -m pip install pandas openpyxl

    - name: Verify installed release wheel
      run: |
        poetry build
        poetry run -- python -c "import glob, subprocess, sys; wheels = glob.glob('dist/jaxprop-*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', wheels[0]])"
        poetry run -- python development/performance/phase_support_release/wheel_checks.py --wheel dist --receipt development/performance/phase_support_release/results/wheel.json -- tests/test_bicubic_phase_support.py -c tests/pytest.ini -q

    - name: Run tests
      run: poetry run -- python -m pytest tests -c tests/pytest.ini -q


  test_windows:
    runs-on: windows-latest
    env:
      JAX_ENABLE_X64: "true"
      JAX_PLATFORM_NAME: cpu
      JAXPROP_TEST_BACKENDS: HEOS
      MPLBACKEND: Agg

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install "poetry>=2.1,<3"

      - name: Install dependencies
        run: |
          poetry install
          poetry run python -m pip install pandas openpyxl
        
      - name: Verify installed release wheel
        run: |
          poetry build
          poetry run -- python -c "import glob, subprocess, sys; wheels = glob.glob('dist/jaxprop-*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', wheels[0]])"
          poetry run -- python development/performance/phase_support_release/wheel_checks.py --wheel dist --receipt development/performance/phase_support_release/results/wheel.json -- tests/test_bicubic_phase_support.py -c tests/pytest.ini -q

      - name: Run tests
        run: poetry run -- python -m pytest tests -c tests/pytest.ini -q

  publish_to_pypi:

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test_ubuntu, test_windows]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: python -m pip install "poetry>=2.1,<3"

    - name: Install dependencies
      run: poetry install --only=main

    - name: Build and publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        poetry build
        poetry publish --username $TWINE_USERNAME --password $TWINE_PASSWORD
